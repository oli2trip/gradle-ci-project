# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

#this is the name of the workflow and can be name as you wish
name: Java CI with Gradle 

# the event to trigger the workflow/ chain of actions
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# jobs groups a set of action that would be executed
jobs:
  build-java:

    runs-on: ubuntu-latest
    # whever you use an action, 'uses' must be defined
    steps:
    - uses: actions/checkout@v2

    - name: Set up JDK 1.8
      uses: actions/setup-java@v1
      with:
        java-version: 1.8

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build
